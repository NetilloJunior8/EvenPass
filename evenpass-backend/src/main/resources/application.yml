server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: evenpass-backend
  profiles:
    active: dev

  # Database configuration (dev profile uses H2 in PostgreSQL compatibility mode, prod uses PostgreSQL)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:evenpass_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

  # Enable SQL seed on startup
  sql:
    init:
      mode: always

---
# Production profile for PostgreSQL / Supabase connection
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 20000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        temp:
          use_jdbc_metadata_defaults: false

---
# EvenPass Application & Security Config
evenpass:
  jwt:
    # 256-bit HS256 secret key for HMAC SHA
    secret: "evenpass_super_secret_jwt_key_for_production_events_2026_xyz123456789!"
    expiration-ms: 86400000 # 24 hours
  cors:
    allowed-origins: "http://localhost:4200,http://127.0.0.1:4200,http://localhost:8080,http://127.0.0.1:8080,http://localhost:3000,http://127.0.0.1:3000,http://localhost:5500,http://127.0.0.1:5500"
