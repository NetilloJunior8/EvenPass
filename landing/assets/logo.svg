<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <defs>
    <!-- Radiant Primary SaaS Gradient -->
    <linearGradient id="epAzureGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    
    <!-- Obsidian Background Gradient with Blue Ambient -->
    <linearGradient id="epShieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#02142d"/>
    </linearGradient>

    <!-- Subtle Gold/Champagne Edge Reflection for High Luxury -->
    <linearGradient id="epGoldGlint" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Drop Shadow for Precision Depth -->
    <filter id="epGlowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- ICON MONOGRAM: Interlocking Gate & Dynamic 'E' + 'P' Aperture -->
  <g transform="translate(6, 6)" filter="url(#epGlowFilter)">
    <!-- Base Obsidian Tile -->
    <rect x="0" y="0" width="52" height="52" rx="15" fill="url(#epShieldBg)"/>
    <rect x="1" y="1" width="50" height="50" rx="14" fill="none" stroke="url(#epGoldGlint)" stroke-width="1.2" stroke-opacity="0.5"/>

    <!-- Architectural Grid Mesh Lines -->
    <path d="M12 26h28M26 12v28" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.25" stroke-dasharray="2 2"/>

    <!-- Dynamic Interlocking E and P Contour -->
    <!-- 'E' Spine and Bars -->
    <path d="M16 16h13c1.65 0 3 1.35 3 3s-1.35 3-3 3h-9v5h8c1.65 0 3 1.35 3 3s-1.35 3-3 3h-8v5h9c1.65 0 3 1.35 3 3s-1.35 3-3 3H16c-1.65 0-3-1.35-3-3V19c0-1.65 1.35-3 3-3z" fill="url(#epAzureGlow)"/>

    <!-- 'P' Precision Pass Ring / Beacon Loop -->
    <circle cx="35" cy="22" r="4.5" fill="#38bdf8"/>
    <circle cx="35" cy="22" r="2" fill="#02142d"/>
    <path d="M35 26.5v8.5" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Radiant Corner Accent Beacon -->
    <circle cx="43" cy="11" r="2.2" fill="#38bdf8" opacity="0.9"/>
  </g>

  <!-- LOGO WORDMARK TYPOGRAPHY -->
  <g transform="translate(72, 36)">
    <!-- Brand Wordmark with Kerning -->
    <text font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="26" fill="currentColor" letter-spacing="-0.035em">
      Even<tspan fill="url(#epAzureGlow)">Pass</tspan>
    </text>
    
    <!-- Subtitle Meta Tag -->
    <text y="15" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="700" font-size="8.5" fill="#64748b" letter-spacing="0.16em">
      ENTERPRISE EVENT OS &amp; SEATING
    </text>
  </g>
</svg>
