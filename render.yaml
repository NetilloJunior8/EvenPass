services:
  # 1. EvenPass Backend (Spring Boot 3 + Java 21)
  - type: web
    name: evenpass-backend
    runtime: docker
    rootDir: evenpass-backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/v1/events
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://aws-1-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require
      - key: SPRING_DATASOURCE_USERNAME
        value: postgres.wxvueavcyylgnbpksplr
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: EVENPASS_JWT_SECRET
        generateValue: true
      - key: EVENPASS_CORS_ALLOWED_ORIGINS
        value: "*"

  # 2. EvenPass Frontend (Angular PWA + Client Portal)
  - type: web
    name: evenpass-frontend
    runtime: static
    rootDir: evenpass-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist/evenpass-frontend/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
