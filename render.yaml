services:
  # 1. EvenPass Backend (Spring Boot 3 + Java 21)
  - type: web
    name: evenpass-backend
    env: java
    rootDir: evenpass-backend
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/evenpass-backend-1.0.0.jar --spring.profiles.active=prod
    plan: free
    healthCheckPath: /api/v1/events
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        # Reemplazar con la URL JDBC de tu proyecto Supabase (Settings -> Database -> Connection String URI)
        value: jdbc:postgresql://db.xxxx.supabase.co:5432/postgres?sslmode=require
      - key: SPRING_DATASOURCE_USERNAME
        value: postgres
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: EVENPASS_JWT_SECRET
        generateValue: true
      - key: EVENPASS_CORS_ALLOWED_ORIGINS
        value: "*"

  # 2. EvenPass Frontend (Angular PWA + Client Portal)
  - type: web
    name: evenpass-frontend
    env: static
    rootDir: evenpass-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist/evenpass-frontend/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
